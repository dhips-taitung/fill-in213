<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 馬到成功 - 教學管理系統</title>
<style>
  :root {
    --primary-gold: #b8860b;
    --soft-pink: #ffe4e8;
    --soft-blue: #e0f2ff;
    --glass-bg: rgba(255, 255, 255, 0.7);
    --btn-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
  }

  body {
    font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    /* 背景使用圖片中的夢幻漸層感 */
    background: linear-gradient(135deg, #fff5f6 0%, #f0f7ff 50%, #fff9e6 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #5d4037;
    position: relative;
    overflow-x: hidden;
  }

  /* 加入浮動的背景馬圖案裝飾 */
  body::before {
    content: "🐎";
    position: fixed;
    font-size: 150px;
    opacity: 0.03;
    top: 10%;
    right: -20px;
    transform: rotate(-15deg);
    pointer-events: none;
  }

  .container {
    width: 90%;
    max-width: 900px;
    margin-top: 50px;
    background: var(--glass-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 40px;
    padding: 40px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.05);
    border: 1px solid rgba(255,255,255,0.4);
    z-index: 1;
  }

  h2, h3 {
    color: var(--primary-gold);
    text-align: center;
    margin-bottom: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  /* 主功能按鈕區 */
  .link-list {
    display: flex;
    gap: 20px;
    justify-content: center;
    margin-bottom: 20px;
  }

  /* 班級列表格線：每 4 個一列 */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 10px;
  }

  .grade-section {
    margin-top: 30px;
  }

  .grade-title {
    text-align: center;
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .btn-link {
    padding: 15px 10px;
    background: white;
    color: #444;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center;
    box-shadow: var(--btn-shadow);
    border: none;
    font-size: 1rem;
  }

  /* 不同年級給予不同可愛色彩 (參考圖片風格) */
  .grade-1 .btn-link { background: #ffe0e6; } /* 粉紅 */
  .grade-2 .btn-link { background: #fff0d4; } /* 淺橘 */
  .grade-3 .btn-link { background: #d4f5e5; } /* 淺綠 */
  .grade-4 .btn-link { background: #d9edff; } /* 淺藍 */
  .grade-5 .btn-link { background: #ece0ff; } /* 淺紫 */
  .grade-6 .btn-link { background: #ffebd4; } /* 淺黃橘 */

  .btn-link:hover {
    transform: translateY(-5px) scale(1.03);
    box-shadow: 0 12px 20px rgba(0,0,0,0.1);
    filter: brightness(0.95);
  }

  /* 返回按鈕 */
  .btn-back {
    margin: 40px auto 0;
    width: 120px;
    font-size: 0.9rem;
    color: #888;
    background: none;
    box-shadow: none;
    text-decoration: underline;
  }

  /* 登入彈窗 */
  #login-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
    z-index: 999; justify-content: center; align-items: center;
  }
  #login-box {
    background: white; padding: 40px; border-radius: 30px; width: 320px; text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
  }
  input { 
    width: 90%; padding: 12px; margin: 12px 0; border: 1px solid #eee; 
    border-radius: 15px; background: #fafafa; font-size: 1rem;
  }
  .btn-submit { 
    width: 100%; padding: 14px; background: linear-gradient(to right, #ff9a8b, #ff6a88); 
    color: white; border: none; border-radius: 15px; cursor: pointer; 
    font-weight: bold; font-size: 1.1rem; margin-top: 10px;
  }
  .btn-cancel { margin-top: 15px; color: #999; cursor: pointer; font-size: 14px; }
  
  #msg { color: #ff5252; font-size: 13px; margin-top: 8px; height: 18px; }
  .loading { display: none; margin-bottom: 10px; color: var(--primary-gold); font-weight: bold; }
  .hidden { display: none; }

  @media (max-width: 600px) {
    .class-grid { grid-template-columns: repeat(2, 1fr); }
    .container { padding: 20px; width: 95%; }
  }
</style>
</head>
<body>

<div class="container">
  <div id="main-links">
    <h2>🐎 2026 馬到成功版-教學組系統 🐎</h2>
    <div class="link-list">
      <div class="btn-link" onclick="openLogin('https://docs.google.com/spreadsheets/d/1HA14Y11V4vpkQ8g7W3ecV6VyKJaxWzDD4Nah4z8IJOs/edit?usp=drive_link','admin')">資料清除</div>
      <div class="btn-link" onclick="openLogin('https://docs.google.com/spreadsheets/d/1DuMqFM4zSgPh6ZMOgpp36ra1Ya_slmgmp3x6VrmUNiQ/edit?usp=drive_link','admin')">填報設定</div>
      <div class="btn-link" onclick="showClassPage()">班級填報</div>
    </div>
  </div>

  <div id="class-page" class="hidden">
    <h3>🐎 班級成績填報</h3>
    <div id="grade-container">
      </div>
    <div class="btn-link btn-back" onclick="backToMain()">← 返回首頁</div>
  </div>
</div>

<div id="login-overlay">
  <div id="login-box">
    <h3 style="margin-top:0">🐎 身份驗證</h3>
    <input type="text" id="acc" placeholder="輸入帳號">
    <input type="password" id="pwd" placeholder="輸入密碼">
    <div id="msg"></div>
    <div id="loader" class="loading">✨ 正在快馬加鞭驗證中...</div>
    <button class="btn-submit" onclick="doVerify()">登入</button>
    <div class="btn-cancel" onclick="closeLogin()">取消</div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxQQhwneU7Y91bClv5rqwGpjvnuIxeluyfP5SeY1XLxIy8KlAJ2XfKA66MEV6nzj5lq/exec"; 
  let currentUrl = "";
  let target = "";

  const classes = [
    {name:"101", url:"https://docs.google.com/spreadsheets/d/143KUbl7g-Z-TLYFV2ucrA-aeQPjqJrh1WD0xru2rAzI/edit?usp=drive_link"},
    {name:"102", url:"https://docs.google.com/spreadsheets/d/1tq1Q_B3DvFVG739efFqt30Vq26KIJwMOfjzS6FeN2g/edit?usp=drive_link"},
    {name:"103", url:"https://docs.google.com/spreadsheets/d/1J63gH6QhX0cTC8XhvRWg6f030Vw0o4JImFvQKeUSVbY/edit?usp=drive_link"},
    {name:"104", url:"https://docs.google.com/spreadsheets/d/1cu-2XM90mrHSCK_gEnAeU8k7b61u-h3lDSkG86X9pi4/edit?usp=drive_link"},
    {name:"201", url:"https://docs.google.com/spreadsheets/d/17GVgNWoT0z7KWOby6Zotx8PhSkYTrIsT9hyuhU-l6oM/edit?usp=drive_link"},
    {name:"202", url:"https://docs.google.com/spreadsheets/d/1VoS8ZtIbd4f0CZTNMD8EjF41zj20VwNgLkWu4tfRA0U/edit?usp=drive_link"},
    {name:"203", url:"https://docs.google.com/spreadsheets/d/1UYXMqWqb4IgVYrwGvFY2IZEv0WoR_cEJmXU9Mkwe0mE/edit?usp=drive_link"},
    {name:"204", url:"https://docs.google.com/spreadsheets/d/12X7ibLpoxm5nB8iTKGX7AMfuYhAcp8MkwB2iLto4Gkg/edit?usp=drive_link"},
    {name:"301", url:"https://docs.google.com/spreadsheets/d/19Df7JkyFI3Rrsc6ap1n3GCzuKcJZNzS5EiX8fRBWtvc/edit?usp=drive_link"},
    {name:"302", url:"https://docs.google.com/spreadsheets/d/1SIwSMHv3zsmHQblJAtcDY_GTt9d6hH-Do6vyOEAJnKg/edit?usp=drive_link"},
    {name:"303", url:"https://docs.google.com/spreadsheets/d/1JrbxOS2Gvdr3I2F2U8fVc_1gnzsfiVtA-BmSvNjJces/edit?usp=drive_link"},
    {name:"304", url:"https://docs.google.com/spreadsheets/d/1yFiKZ_keE9sU4gJ2q5CCjPcdkkUtdKbsJPOBpNRSGK0/edit?usp=drive_link"},
    {name:"401", url:"https://docs.google.com/spreadsheets/d/1Et5ZbUlovlVUFlw70RqEDnSEDM7VgXctZho_a2-_QAk/edit?usp=drive_link"},
    {name:"402", url:"https://docs.google.com/spreadsheets/d/1SexN-Ro7wXwPBPU7je94trMaFMeozbeCDulDRozOi3Q/edit?usp=drive_link"},
    {name:"403", url:"https://docs.google.com/spreadsheets/d/19qZrXl252GQGOUTHC9BcmDyFu7hnlU3cEkcMge95u8w/edit?usp=drive_link"},
    {name:"404", url:"https://docs.google.com/spreadsheets/d/1MEZOe62s6nV5c-U5DWnTfzdXf3nUBFDn8_GRhQuVdqM/edit?usp=drive_link"},
    {name:"501", url:"https://docs.google.com/spreadsheets/d/1qYNVAPDcpsFEzClj_si9qmQmsZJNcyY_aOHrJE25ZSw/edit?usp=drive_link"},
    {name:"502", url:"https://docs.google.com/spreadsheets/d/1Y9J0kaOEIfrrGPUFfjCd0q39spszMOTBJ-b2I3QP5tM/edit?usp=drive_link"},
    {name:"503", url:"https://docs.google.com/spreadsheets/d/1wndongYbhO_sv99qzR6S6IGX2S5qyCpgRuOpDf51RGE/edit?usp=drive_link"},
    {name:"504", url:"https://docs.google.com/spreadsheets/d/1khQr5zkCRW8a0pr5YDmkkS4A4FDcDVGROtsws9Xaa8U/edit?usp=drive_link"},
    {name:"601", url:"https://docs.google.com/spreadsheets/d/1pVFpRPkqpZFbnufVRNo_0LI_OhrAWIlff73Vw6LXEZk/edit?usp=drive_link"},
    {name:"602", url:"https://docs.google.com/spreadsheets/d/1rzg48aQAO_TFHNgdFGuV1libzwtB1ZmNIJJlS6Wq2AE/edit?usp=drive_link"},
    {name:"603", url:"https://docs.google.com/spreadsheets/d/1yA6gDLj8JPiDHaw5ILTsUV0jbi1Ccg7ImGy5nXgt0YU/edit?usp=drive_link"},
    {name:"604", url:"https://docs.google.com/spreadsheets/d/150QH2hxXhQ4gWK-beTT1fLrgcSiy9AslrM81LNiWGI4/edit?usp=drive_link"}
  ];

  // 生成班級分頁內容
  function renderClasses() {
    const container = document.getElementById('grade-container');
    const grades = [
      {title: "🌸 一年級", icon: "🌸", class: "grade-1"},
      {title: "🌷 二年級", icon: "🌷", class: "grade-2"},
      {title: "🍀 三年級", icon: "🍀", class: "grade-3"},
      {title: "☀️ 四年級", icon: "☀️", class: "grade-4"},
      {title: "🍇 五年級", icon: "🍇", class: "grade-5"},
      {title: "🌈 六年級", icon: "🌈", class: "grade-6"}
    ];

    grades.forEach((g, index) => {
      const section = document.createElement('div');
      section.className = `grade-section ${g.class}`;
      
      const title = document.createElement('div');
      title.className = 'grade-title';
      title.innerHTML = g.title;
      section.appendChild(title);

      const grid = document.createElement('div');
      grid.className = 'class-grid';

      // 篩選該年級班級 (例如 index=0 找 101-104)
      const gradeNum = (index + 1).toString();
      const filtered = classes.filter(c => c.name.startsWith(gradeNum));

      filtered.forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'btn-link';
        btn.innerText = c.name;
        btn.onclick = () => openLogin(c.url, 'class');
        grid.appendChild(btn);
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  renderClasses();

  function showClassPage(){
    document.getElementById('main-links').classList.add('hidden');
    document.getElementById('class-page').classList.remove('hidden');
    window.scrollTo(0,0);
  }

  function backToMain(){
    document.getElementById('class-page').classList.add('hidden');
    document.getElementById('main-links').classList.remove('hidden');
  }

  function openLogin(url, t){
    currentUrl = url;
    target = t;
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('acc').value = "";
    document.getElementById('pwd').value = "";
    document.getElementById('msg').innerText = "";
  }

  function closeLogin(){
    document.getElementById('login-overlay').style.display = 'none';
  }

  async function doVerify(){
    const user = document.getElementById('acc').value;
    const pass = document.getElementById('pwd').value;
    const msg = document.getElementById('msg');
    const loader = document.getElementById('loader');

    if(!user || !pass){
      msg.innerText = "請完整輸入帳號密碼";
      return;
    }

    msg.innerText = "";
    loader.style.display = "block";

    try{
      const response = await fetch(`${GAS_URL}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}&target=${encodeURIComponent(target)}`);
      const data = await response.json();
      loader.style.display = "none";

      if(data.ok===true){
        window.open(currentUrl,'_blank');
        closeLogin();
      }else{
        msg.innerText = data.msg ? data.msg : "帳號或密碼錯誤";
      }

    }catch(e){
      loader.style.display = "none";
      msg.innerText = "連線發生錯誤";
      console.error(e);
    }
  }
</script>
</body>
</html>
