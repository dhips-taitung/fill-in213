<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐎 2026 馬到成功 - 教學組系統</title>
<style>
  :root {
    --primary-gold: #c6934b;
    --soft-red: #ff7e79;
    --cute-pink: #ffe4e6;
    --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #fff9f0 50%, #f0f7ff 100%);
    --card-shadow: 0 8px 32px rgba(0,0,0,0.08);
  }

  body {
    font-family: "Microsoft JhengHei", sans-serif;
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: #5a4a42;
    overflow-x: hidden;
  }

  /* 背景豐富性：馬年動態浮水印 */
  body::before {
    content: "🐎";
    position: fixed;
    font-size: 400px;
    opacity: 0.03;
    top: 10%;
    right: -100px;
    transform: rotate(-15deg);
    pointer-events: none;
    z-index: -1;
  }

  /* 玻璃擬態容器 */
  .container {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 40px;
    padding: 40px;
    margin: 40px 20px;
    box-shadow: var(--card-shadow);
    border: 1px solid rgba(255, 255, 255, 0.5);
    width: 90%;
    max-width: 900px;
    text-align: center;
  }

  h2, h3 {
    color: var(--primary-gold);
    letter-spacing: 2px;
    margin-bottom: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }

  h2::before, h2::after { content: "🐎"; font-size: 1.2rem; }

  /* 年級分組樣式 */
  .grade-section {
    margin-bottom: 30px;
    background: rgba(255, 255, 255, 0.4);
    padding: 20px;
    border-radius: 20px;
  }

  .grade-title {
    font-weight: bold;
    color: #d32f2f;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* 每 4 個班一列的 Grid 排版 */
  .link-list, .class-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 20px;
  }

  /* 首頁三個按鈕特別置中 */
  #main-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-link {
    padding: 15px 10px;
    background: #fff;
    border: none;
    color: #7d6e66;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    text-align: center;
    min-width: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* 按鈕不同顏色裝飾 */
  .btn-link:nth-child(4n+1) { background: #ffebee; border-bottom: 4px solid #ffcdd2; }
  .btn-link:nth-child(4n+2) { background: #fff3e0; border-bottom: 4px solid #ffe0b2; }
  .btn-link:nth-child(4n+3) { background: #f1f8e9; border-bottom: 4px solid #dcedc8; }
  .btn-link:nth-child(4n+4) { background: #e3f2fd; border-bottom: 4px solid #bbdefb; }

  .btn-link:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    filter: brightness(1.02);
  }

  /* 登入彈窗 */
  #login-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(90, 74, 66, 0.4); backdrop-filter: blur(8px); z-index: 999;
    justify-content: center; align-items: center;
  }
  
  #login-box {
    background: white; padding: 40px; border-radius: 30px; width: 320px;
    text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    border: 8px solid var(--cute-pink);
  }

  input {
    width: 90%; padding: 12px; margin: 10px 0;
    border: 2px solid #f0f0f0; border-radius: 15px;
    background: #fafafa; outline: none; transition: 0.3s;
  }

  input:focus { border-color: var(--soft-red); background: #fff; }

  .btn-submit {
    width: 100%; padding: 12px;
    background: linear-gradient(to right, #ff9a9e, #fecfef);
    color: white; border: none; border-radius: 15px;
    cursor: pointer; font-weight: bold; font-size: 1.1rem; margin-top: 15px;
  }

  .btn-cancel { margin-top: 15px; color: #aaa; cursor: pointer; font-size: 14px; }
  #msg { color: #e57373; font-size: 13px; margin-top: 10px; height: 18px; }
  .loading { display: none; color: var(--primary-gold); margin-bottom: 10px; font-weight: bold; }
  .hidden { display: none; }

  @media (max-width: 600px) {
    .class-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div class="container">
  <div id="main-view">
    <h2>2026 馬到成功版-教學系統</h2>
    <div class="link-list" id="main-links">
      <div class="btn-link" onclick="openLogin('https://docs.google.com/spreadsheets/d/1HA14Y11V4vpkQ8g7W3ecV6VyKJaxWzDD4Nah4z8IJOs/edit?usp=drive_link','admin')">
        <span>🗑️</span>資料清除
      </div>
      <div class="btn-link" onclick="openLogin('https://docs.google.com/spreadsheets/d/1DuMqFM4zSgPh6ZMOgpp36ra1Ya_slmgmp3x6VrmUNiQ/edit?usp=drive_link','admin')">
        <span>⚙️</span>填報設定
      </div>
      <div class="btn-link" onclick="showClassPage()">
        <span>🐎</span>班級填報
      </div>
    </div>
  </div>

  <div id="class-page" class="hidden">
    <h3>🧧 班級成績填報</h3>
    <div id="grade-container">
      </div>
    <div style="margin-top:30px;">
      <div class="btn-link" style="display:inline-block; min-width: 150px;" onclick="backToMain()">⬅️ 返回主頁</div>
    </div>
  </div>
</div>

<div id="login-overlay">
  <div id="login-box">
    <h3 style="margin-top:0">🐎 身份驗證</h3>
    <input type="text" id="acc" placeholder="輸入帳號">
    <input type="password" id="pwd" placeholder="輸入密碼">
    <div id="msg"></div>
    <div id="loader" class="loading">正在躍馬驗證中...</div>
    <button class="btn-submit" onclick="doVerify()">登入系統</button>
    <div class="btn-cancel" onclick="closeLogin()">取消返回</div>
  </div>
</div>

<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxQQhwneU7Y91bClv5rqwGpjvnuIxeluyfP5SeY1XLxIy8KlAJ2XfKA66MEV6nzj5lq/exec"; 
  let currentUrl = "";
  let target = "";

  const classes = [
    {name:"101", url:"..."}, {name:"102", url:"..."}, {name:"103", url:"..."}, {name:"104", url:"..."},
    {name:"201", url:"..."}, {name:"202", url:"..."}, {name:"203", url:"..."}, {name:"204", url:"..."},
    {name:"301", url:"..."}, {name:"302", url:"..."}, {name:"303", url:"..."}, {name:"304", url:"..."},
    {name:"401", url:"..."}, {name:"402", url:"..."}, {name:"403", url:"..."}, {name:"404", url:"..."},
    {name:"501", url:"..."}, {name:"502", url:"..."}, {name:"503", url:"..."}, {name:"504", url:"..."},
    {name:"601", url:"..."}, {name:"602", url:"..."}, {name:"603", url:"..."}, {name:"604", url:"..."}
  ];

  // 渲染班級：按年級分組，每列4個
  function renderClasses() {
    const container = document.getElementById('grade-container');
    const emojis = ["🌸", "🌷", "🌺", "🌻", "🌼", "🌈"];
    
    for (let g = 1; g <= 6; g++) {
      const section = document.createElement('div');
      section.className = 'grade-section';
      
      const title = document.createElement('div');
      title.className = 'grade-title';
      title.innerHTML = `${emojis[g-1]} ${g} 年級`;
      section.appendChild(title);
      
      const grid = document.createElement('div');
      grid.className = 'class-grid';
      
      const gradeClasses = classes.filter(c => c.name.startsWith(g.toString()));
      gradeClasses.forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'btn-link';
        btn.innerText = c.name;
        btn.onclick = () => openLogin(c.url, 'class');
        grid.appendChild(btn);
      });
      
      section.appendChild(grid);
      container.appendChild(section);
    }
  }

  renderClasses();

  function showClassPage(){
    document.getElementById('main-view').classList.add('hidden');
    document.getElementById('class-page').classList.remove('hidden');
  }

  function backToMain(){
    document.getElementById('class-page').classList.add('hidden');
    document.getElementById('main-view').classList.remove('hidden');
  }

  function openLogin(url, t){
    currentUrl = url;
    target = t;
    document.getElementById('login-overlay').style.display = 'flex';
    document.getElementById('acc').value = "";
    document.getElementById('pwd').value = "";
    document.getElementById('msg').innerText = "";
  }

  function closeLogin(){
    document.getElementById('login-overlay').style.display = 'none';
  }

  async function doVerify(){
    const user = document.getElementById('acc').value;
    const pass = document.getElementById('pwd').value;
    const msg = document.getElementById('msg');
    const loader = document.getElementById('loader');

    if(!user || !pass){
      msg.innerText = "請輸入帳號與密碼唷！";
      return;
    }

    msg.innerText = "";
    loader.style.display = "block";

    try{
      const response = await fetch(`${GAS_URL}?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}&target=${encodeURIComponent(target)}`);
      const data = await response.json();
      loader.style.display = "none";

      if(data.ok===true){
        window.open(currentUrl,'_blank');
        closeLogin();
      }else{
        msg.innerText = data.msg ? data.msg : "哎呀，帳號密碼好像不對唷";
      }
    }catch(e){
      loader.style.display = "none";
      msg.innerText = "連線失敗，請檢查網路設定";
    }
  }
</script>
</body>
</html>
